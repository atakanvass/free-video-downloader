name: Windows build
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install FFmpeg
        shell: powershell
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'
      - name: Build executable
        shell: powershell
        run: ./windows/build.ps1
      - name: Test packaged tools
        shell: powershell
        run: |
          $p = Start-Process -FilePath './windows/dist/Free Video Downloader.exe' -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Self-test failed: $($p.ExitCode)" }
      - name: Test video format lookup
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'format-test.jsonl'
          $p = Start-Process -FilePath './windows/dist/Free Video Downloader.exe' -ArgumentList @('--worker', 'formats', 'https://www.youtube.com/watch?v=aqz-KE-bpKQ') -RedirectStandardOutput $output -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-Content $output; throw "Format lookup failed: $($p.ExitCode)" }
          $events = Get-Content $output | ForEach-Object { try { $_ | ConvertFrom-Json } catch {} }
          if (-not ($events | Where-Object { $_.kind -eq 'formats' -and $_.heights.Count -gt 0 })) { throw 'Format lookup did not return any video qualities' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FreeVideoDownloader-Windows-x64
          path: windows/dist/Free Video Downloader.exe
          if-no-files-found: warn
